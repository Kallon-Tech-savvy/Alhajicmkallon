name: Temporary research library formatting

on:
  push:
    branches: [feature/research-library]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-library
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository formatter only to this feature
        run: |
          npx prettier --write \
            src/lib/research-library.ts \
            src/components/ResearchLibrary.tsx \
            src/app/library/page.tsx \
            src/components/NavbarInteractions.tsx \
            src/components/Footer.tsx \
            src/app/sitemap.ts \
            src/app/knowledge/page.tsx \
            src/app/writing/page.tsx
      - name: Commit formatting if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/
            git commit -m "Format research library with repository Prettier rules"
            git push origin HEAD:feature/research-library
          fi
