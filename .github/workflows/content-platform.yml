name: Content platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/content-platform-foundation]

# Avoid overlapping audits on successive commits; contention makes Lighthouse noisy.
concurrency:
  group: content-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test content parser
        run: npm run test:content
      - name: Test contact form fallback
        run: npm run test:contact
      - name: Test homepage performance boundary
        run: npm run test:homepage-performance
      - name: Lint
        run: npm run lint
      - name: Prove deep-module boundaries (pass, fail, pass)
        run: npm run test:boundaries
      - name: Check deployment wizard shell syntax
        run: bash -n scripts/wizard-vercel-deployment.sh
      - name: Production build
        run: npm run build
      - name: Start production server for performance audit
        run: |
          npm run start > /tmp/portfolio-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Production server is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-next.log
          exit 1
      - name: Run Lighthouse performance audit
        run: |
          npx --yes lighthouse http://127.0.0.1:3000/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,seo \
            --output=json \
            --output-path=./lighthouse-report.json
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = './lighthouse-report.json';
          if (!fs.existsSync(reportPath)) {
            console.error('Lighthouse did not produce a report.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const score = report.categories.performance.score;
          const seoScore = report.categories.seo.score;
          const metrics = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'interactive',
          ];

          console.log(`Lighthouse performance score: ${Math.round(score * 100)}`);
          console.log(`Lighthouse SEO score: ${Math.round(seoScore * 100)}`);
          console.log('Core performance metrics:');
          for (const id of metrics) {
            const audit = report.audits[id];
            if (audit) console.log(`- ${audit.title}: ${audit.displayValue ?? audit.score}`);
          }

          const failures = Object.values(report.audits)
            .filter((audit) => audit.score !== null && audit.score < 1)
            .sort((a, b) =>
              (b.details?.overallSavingsMs ?? 0) - (a.details?.overallSavingsMs ?? 0)
            )
            .slice(0, 10);

          console.log('Highest-impact audits needing attention:');
          for (const audit of failures) {
            const savings = audit.details?.overallSavingsMs;
            const suffix = Number.isFinite(savings) ? ` (potential savings: ${Math.round(savings)} ms)` : '';
            console.log(`- [${audit.score}] ${audit.title}: ${audit.displayValue ?? 'Needs review'}${suffix}`);
          }

          if (score < 0.8) {
            console.error('Performance budget failed: expected at least 80/100.');
            process.exitCode = 1;
          }
          if (seoScore < 1) {
            console.error('SEO / discoverability budget failed: expected 100/100.');
            process.exitCode = 1;
          }
          NODE
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-performance-report
          path: lighthouse-report.json
          if-no-files-found: warn
          retention-days: 7
