name: Content platform checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/content-platform-foundation]

# Avoid overlapping audits on successive commits; contention makes Lighthouse noisy.
concurrency:
  group: content-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test content parser
        run: npm run test:content
      - name: Test contact form fallback
        run: npm run test:contact
      - name: Test chat request security
        run: npm run test:security
      - name: Test Lighthouse report diagnostics
        run: npm run test:performance-report
      - name: Typecheck
        run: npm run typecheck
      - name: Prove deep-module boundaries
        run: npm run test:boundaries
      - name: Test homepage performance boundary
        run: npm run test:homepage-performance
      - name: Lint
        run: npm run lint
      - name: Check deployment wizard shell syntax
        run: bash -n scripts/wizard-vercel-deployment.sh
      - name: Production build
        run: npm run build
      - name: Verify browser bundle excludes published full-text content
        run: npm run test:browser-bundle
      - name: Start production server for performance audit
        run: |
          npm run start > /tmp/portfolio-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Production server is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-next.log
          exit 1
      - name: Test production crawl, search and AI discovery endpoints
        run: node --test scripts/discovery-endpoints.test.mjs
      - name: Run three independent Lighthouse audits
        run: |
          mkdir -p lighthouse-reports
          for attempt in 1 2 3; do
            echo "Lighthouse audit ${attempt}/3"
            npx --yes lighthouse http://127.0.0.1:3000/ \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,seo \
              --output=json \
              --output-path="./lighthouse-reports/run-${attempt}.json"
          done
          node scripts/verify-lighthouse-baseline.mjs \
            lighthouse-reports/run-1.json \
            lighthouse-reports/run-2.json \
            lighthouse-reports/run-3.json
      - name: Summarize main-thread CPU costs across audits
        if: always()
        run: |
          for report in lighthouse-reports/run-*.json; do
            if [ -f "$report" ]; then node scripts/report-main-thread.mjs "$report"; fi
          done
      - name: Upload Lighthouse baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-performance-baseline
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 7
