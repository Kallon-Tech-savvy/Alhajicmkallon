name: Content platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/content-platform-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test content parser
        run: npm run test:content
      - name: Lint
        run: npm run lint
      - name: Prove deep-module boundaries (pass, fail, pass)
        run: npm run test:boundaries
      - name: Check deployment wizard shell syntax
        run: bash -n scripts/wizard-vercel-deployment.sh
      - name: Production build
        run: npm run build
